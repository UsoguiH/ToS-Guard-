<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToS Guard — Scan History</title>
    <link rel="stylesheet" href="../lib/fonts/fonts.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="wrap">
      <header class="topbar">
        <div class="brand">
          <div class="logo">
            <svg viewBox="0 0 24 24" width="28" height="28">
              <defs>
                <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#17171c"/>
                  <stop offset="100%" stop-color="#003c33"/>
                </linearGradient>
              </defs>
              <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="url(#lg)"/>
              <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <h1>Scan History</h1>
            <p class="muted">Every ToS, Privacy Policy, and EULA you've scanned with ToS Guard.</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="langBtn" class="ghost" title="Toggle language">EN</button>
          <button id="settingsBtn" class="ghost" title="Settings">Settings</button>
        </div>
      </header>

      <section class="card filters">
        <div class="filters-row">
          <input id="search" type="search" placeholder="Search by site, title, or clause text…" autocomplete="off" />
          <select id="riskFilter">
            <option value="">All risk levels</option>
            <option value="high">High risk (70+)</option>
            <option value="medium">Moderate (40–69)</option>
            <option value="low">Some issues (15–39)</option>
            <option value="good">Looks OK (&lt;15)</option>
          </select>
          <button id="clearBtn" class="ghost danger">Clear all</button>
        </div>
        <div id="count" class="muted count-line">—</div>
      </section>

      <section id="emptyState" class="card empty hidden">
        <div class="empty-icon">
          <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
            <circle cx="32" cy="32" r="28" fill="none" stroke="#d9d9dd" stroke-width="2"/>
            <path d="M20 36c4 6 20 6 24 0" stroke="#75758a" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="24" cy="26" r="2" fill="#75758a"/>
            <circle cx="40" cy="26" r="2" fill="#75758a"/>
          </svg>
        </div>
        <h2>No scans yet</h2>
        <p class="muted">Scan a Terms of Service or Privacy Policy with ToS Guard and it'll show up here.</p>
      </section>

      <section id="list" class="list"></section>

      <footer>
        <span class="muted">Your history is stored locally in this browser — nothing is uploaded.</span>
      </footer>
    </div>

    <template id="entryTpl">
      <article class="entry">
        <header class="entry-head">
          <div class="entry-meta">
            <div class="entry-title"></div>
            <div class="entry-sub">
              <span class="entry-host"></span>
              <span class="dot-sep">·</span>
              <span class="entry-date"></span>
              <span class="dot-sep">·</span>
              <span class="entry-doctype"></span>
            </div>
          </div>
          <div class="entry-score">
            <div class="score-num"></div>
            <div class="score-badge"></div>
          </div>
          <div class="entry-actions">
            <button class="link-btn open-btn" title="Open original URL">Open ↗</button>
            <button class="link-btn toggle-btn">Show clauses</button>
            <button class="link-btn delete-btn danger" title="Delete this scan">×</button>
          </div>
        </header>
        <div class="entry-body hidden">
          <div class="entry-summary"></div>
          <div class="entry-counts">
            <span class="count-pill high"><span class="dot"></span><span class="c-high">0</span> high</span>
            <span class="count-pill medium"><span class="dot"></span><span class="c-med">0</span> medium</span>
            <span class="count-pill low"><span class="dot"></span><span class="c-low">0</span> low</span>
          </div>
          <div class="entry-clauses"></div>
        </div>
      </article>
    </template>

    <template id="clauseTpl">
      <div class="clause">
        <div class="clause-head">
          <span class="sev-pill"><span class="dot"></span><span class="sev-text"></span></span>
          <span class="clause-title"></span>
          <span class="cat-chip"></span>
        </div>
        <p class="clause-why"></p>
        <blockquote class="clause-snippet"></blockquote>
      </div>
    </template>

    <script src="history.js"></script>
  </body>
</html>
